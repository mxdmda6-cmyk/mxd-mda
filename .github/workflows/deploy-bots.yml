name: "Bot Deployment Gate"

# Manual dry-run gate for future bot deployments.
# Live deployment stays disabled until bot code, Fly.io config, secrets,
# rollback logic, and QA approval are all present.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Bot deployment target to inspect"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - lorekeeper
          - social-alchemist
          - high-priestess

jobs:
  deployment-gate:
    name: Validate Bot Deployment Readiness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Report gate status
        run: |
          echo "🤖 Bot deployment target: ${{ inputs.target }}"
          echo "🚫 Live deployment is intentionally disabled."
          echo "📋 Required before activation:"
          echo "   1. Bot source code committed under src/bots/"
          echo "   2. Deployment config committed and reviewed"
          echo "   3. FLY_API_TOKEN stored as a GitHub Secret"
          echo "   4. Rollback command documented"
          echo "   5. QA approval recorded"

      - name: Check expected bot directories
        run: |
          for path in src/bots/lorekeeper src/bots/social_alchemist src/bots/high_priestess; do
            if [ -d "$path" ]; then
              echo "✅ Found $path"
            else
              echo "⚠️ Missing $path"
            fi
          done

      - name: Exit safely
        run: |
          echo "Gate complete. No deployment attempted."
