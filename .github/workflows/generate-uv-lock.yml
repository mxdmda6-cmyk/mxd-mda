name: Generate uv lock for hardening branch

on:
  push:
    branches: [agent/stack-hardening-v01]
    paths: [pyproject.toml]
  pull_request:
    branches: [main]
    paths: [pyproject.toml]

permissions:
  contents: write

jobs:
  lock:
    if: github.head_ref == 'agent/stack-hardening-v01' || github.ref_name == 'agent/stack-hardening-v01'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stack-hardening-v01
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
      - name: Generate lockfile
        run: uv lock
      - name: Commit lockfile
        run: |
          if [ -z "$(git status --porcelain -- uv.lock)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: generate uv lock"
          git push
