name: "Test & Quality"

# Runs deterministic, secret-free smoke checks on PRs and pushes.
on:
  push:
    branches: [ "main", "claude/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install rich typer

      - name: Run orchestrator smoke checks
        run: |
          python -m compileall src
          python -c "import src.orchestrator; print('✅ Orchestrator imports successfully')"
          python src/orchestrator/main.py version
          python src/orchestrator/main.py test

  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black mypy rich typer

      - name: Check formatting with Black
        run: black --check src/

      - name: Lint with Ruff
        run: ruff check src/

      - name: Type check with MyPy
        run: mypy src/ --ignore-missing-imports
