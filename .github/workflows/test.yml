name: "Test & Quality"

on:
  push:
    branches: ["main", "agent/*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  quality:
    name: Locked Python 3.12 Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Verify lockfile
        run: uv lock --check

      - name: Sync locked environment
        run: uv sync --frozen --all-groups

      - name: Run orchestrator smoke checks
        run: |
          uv run python -m compileall -q src tests
          uv run python -c "import src.orchestrator; print('Orchestrator imports successfully')"
          uv run python src/orchestrator/main.py version
          uv run python src/orchestrator/main.py doctor

      - name: Run pytest
        run: uv run pytest --cov=src --cov-report=term-missing

      - name: Lint with Ruff
        run: uv run ruff check src tests migrations

      - name: Check formatting with Ruff
        run: uv run ruff format --check src tests migrations

      - name: Type check with MyPy
        run: uv run mypy src tests

      - name: Validate Alembic SQL
        run: uv run alembic upgrade head --sql > /tmp/mxd_mda_migration.sql
