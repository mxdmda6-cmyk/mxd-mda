name: Hardening Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, agent/stack-hardening-v01]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true
      - name: Verify lockfile
        run: uv lock --check
      - name: Sync locked environment
        run: uv sync --frozen --all-groups
      - name: Compile
        run: uv run python -m compileall -q src tests
      - name: Test
        run: uv run pytest --cov=src --cov-report=term-missing
      - name: Ruff check
        run: uv run ruff check src tests migrations
      - name: Ruff format check
        run: uv run ruff format --check src tests migrations
      - name: Type check
        run: uv run mypy src tests
      - name: Validate Alembic SQL
        run: uv run alembic upgrade head --sql > /tmp/mxd_mda_migration.sql
