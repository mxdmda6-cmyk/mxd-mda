[project]
name = "mxd-mda"
version = "0.1.0"
description = "MXD-MDA transmedia orchestration system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "rich>=13.7,<15",
  "typer>=0.9,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.8,<2",
  "pre-commit>=3.6,<5",
  "pytest>=8,<10",
  "pytest-cov>=4,<8",
  "ruff>=0.2,<1",
]
agents = []
publishing = []
integrations = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.8,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[tool.uv]
package = false
default-groups = ["dev", "integrations"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]
